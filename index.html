    <script>
      // Single Page App path restoration from 404.html fallback
      (function() {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (redirectPath) {
          params.delete('p');
          var searchStr = params.toString() ? ('?' + params.toString()) : '';
          var newUrl = window.location.pathname.replace(/\/$/, '') + '/' + decodeURIComponent(redirectPath) + searchStr + window.location.hash;
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>
