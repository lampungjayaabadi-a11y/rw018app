<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aplikasi RW 018 - Memuat Halaman...</title>
    <link rel="icon" type="image/jpeg" href="logo-rw-018.jpg" />
    <script>
      // GitHub Pages SPA fallback for /rw018app/* routes.
      (function () {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var repo = segments[0] || 'rw018app';
        var route = segments.slice(1).join('/');
        var query = new URLSearchParams(window.location.search);
        query.set('p', route);
        var target = '/' + repo + '/?' + query.toString() + window.location.hash;
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #064e3b;
        color: #f8fafc;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: rgba(6, 78, 59, 0.85);
        border: 1px solid rgba(52, 211, 153, 0.3);
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 420px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }
      .spinner {
        border: 3.5px solid rgba(255, 255, 255, 0.15);
        border-top: 3.5px solid #34d399;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      h1 { font-size: 1.15rem; font-weight: 700; margin: 0 0 8px; color: #ffffff; }
      p { font-size: 0.875rem; color: #a7f3d0; line-height: 1.5; margin: 0 0 16px; }
      a {
        display: inline-block;
        background: #059669;
        color: white;
        text-decoration: none;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h1>Aplikasi Administrasi RW 018</h1>
      <p>Sedang mengalihkan ke halaman yang dituju...</p>
      <a href="./">Buka Beranda Aplikasi</a>
    </div>
  </body>
</html>
